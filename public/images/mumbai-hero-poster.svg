<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E8CC"/>
      <stop offset="30%" stop-color="#E8C490"/>
      <stop offset="55%" stop-color="#D4956A"/>
      <stop offset="75%" stop-color="#C76B4A"/>
      <stop offset="100%" stop-color="#8B4A32"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A8A6E"/>
      <stop offset="30%" stop-color="#354B3A"/>
      <stop offset="70%" stop-color="#243428"/>
      <stop offset="100%" stop-color="#1A2620"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F7E8CC" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#C76B4A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Golden hour sky -->
  <rect width="1920" height="594" fill="url(#sky)"/>
  <!-- Arabian Sea -->
  <rect y="540" width="1920" height="540" fill="url(#sea)"/>
  <!-- Horizon warmth -->
  <rect y="378" width="1920" height="324" fill="url(#glow)"/>
  <!-- Minimal Mumbai skyline silhouettes -->
  <g fill="#282824" opacity="0.32">
    <rect x="175" y="410" width="55" height="160" rx="2"/>
    <rect x="310" y="370" width="70" height="200" rx="2"/>
    <rect x="520" y="380" width="60" height="180" rx="2"/>
    <rect x="600" y="335" width="80" height="235" rx="2"/>
    <rect x="830" y="355" width="65" height="215" rx="2"/>
    <rect x="1040" y="345" width="75" height="235" rx="2"/>
    <rect x="1260" y="375" width="60" height="190" rx="2"/>
    <rect x="1340" y="320" width="80" height="275" rx="3"/>
    <rect x="1700" y="365" width="60" height="205" rx="2"/>
    <rect x="120" y="440" width="40" height="110" rx="1"/>
    <rect x="455" y="460" width="30" height="80" rx="1"/>
    <rect x="770" y="430" width="40" height="120" rx="1"/>
    <rect x="980" y="450" width="35" height="95" rx="1"/>
    <rect x="1200" y="440" width="40" height="100" rx="1"/>
    <rect x="1510" y="425" width="40" height="130" rx="1"/>
    <rect x="1840" y="410" width="55" height="170" rx="2"/>
  </g>
  <!-- Marine Drive Queen's Necklace curve -->
  <path d="M100,583 Q672,626 1248,562 Q1632,518 1820,551" stroke="#F7E8CC" stroke-opacity="0.55" stroke-width="2.5" fill="none"/>
  <!-- Streetlight dots along the curve -->
  <g fill="#F7E8CC" fill-opacity="0.85">
    <circle cx="200" cy="590" r="2.5"/><circle cx="290" cy="596" r="2.5"/><circle cx="380" cy="601" r="2.5"/>
    <circle cx="470" cy="605" r="2.5"/><circle cx="560" cy="608" r="2.5"/><circle cx="650" cy="609" r="2.5"/>
    <circle cx="740" cy="607" r="2.5"/><circle cx="830" cy="602" r="2.5"/><circle cx="920" cy="595" r="2.5"/>
    <circle cx="1010" cy="586" r="2.5"/><circle cx="1100" cy="576" r="2.5"/><circle cx="1190" cy="567" r="2.5"/>
    <circle cx="1280" cy="560" r="2.5"/><circle cx="1370" cy="555" r="2.5"/><circle cx="1460" cy="551" r="2.5"/>
    <circle cx="1550" cy="549" r="2.5"/><circle cx="1640" cy="548" r="2.5"/><circle cx="1730" cy="550" r="2.5"/>
  </g>
  <!-- Subtle water reflection streaks -->
  <g stroke="#F7E8CC" stroke-width="0.8" opacity="0.08">
    <line x1="300" y1="600" x2="305" y2="680"/>
    <line x1="550" y1="620" x2="548" y2="710"/>
    <line x1="800" y1="610" x2="803" y2="690"/>
    <line x1="1050" y1="595" x2="1047" y2="675"/>
    <line x1="1300" y1="580" x2="1302" y2="660"/>
    <line x1="1550" y1="570" x2="1553" y2="650"/>
  </g>
</svg>

