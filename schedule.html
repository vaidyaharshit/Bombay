<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Schedule — The 12 Chronicles</title>
  <meta name="description" content="Collaborative day-wise itinerary and master timeline for 12 friends at IIT Bombay Techfest & Mumbai 2026." />
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ivory: '#F7F4EC',
            forest: { DEFAULT: '#354B3A', dark: '#243428', light: '#46624D' },
            terracotta: { DEFAULT: '#C76B4A', dark: '#AB5636', light: '#D88467' },
            olive: { DEFAULT: '#A4A88A', dark: '#8A8E71', light: '#C2C5AD' },
            charcoal: { DEFAULT: '#282824', light: '#40403B', muted: '#6B6B63' }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#F7F4EC] text-[#282824] paper-texture flex flex-col min-h-screen">

  <!-- Shared Global Navigation -->
  <div id="global-nav"></div>

  <!-- Header Banner -->
  <section class="border-b border-[#A4A88A]/30 bg-white/50 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
          <span class="text-xs font-bold uppercase tracking-widest text-[#C76B4A]">Master Itinerary</span>
          <h1 class="font-serif text-3xl sm:text-5xl font-bold text-[#282824] mt-1">Trip Schedule</h1>
          <p class="text-xs sm:text-sm text-[#282824]/70 mt-2 max-w-xl">
            Live vertical timeline synced across all 12 members. From arrival at CSMT to Techfest hackathons and midnight strolls on Marine Drive.
          </p>
        </div>

        <!-- Add Activity Button -->
        <div>
          <button id="add-activity-btn" 
                  class="px-5 py-2.5 rounded-xl bg-[#354B3A] hover:bg-[#243428] text-white text-xs font-bold tracking-wide transition-all shadow-sm flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span>Add Activity</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Timeline Body -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full space-y-8">
    
    <!-- Upcoming Activity Highlight Banner -->
    <div id="upcoming-banner"></div>

    <!-- Filter Bar: Day Tabs & Search -->
    <div class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <!-- Day Tabs -->
        <div id="day-tabs" class="flex flex-wrap items-center gap-2">
          <button data-day="all" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-[#354B3A] text-white transition-all shadow-sm">
            All Days
          </button>
          <button data-day="1" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-[#282824] border border-[#A4A88A]/30 hover:border-[#354B3A] transition-all">
            Day 1 (Dec 24)
          </button>
          <button data-day="2" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-[#282824] border border-[#A4A88A]/30 hover:border-[#354B3A] transition-all">
            Day 2 (Dec 25)
          </button>
          <button data-day="3" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-[#282824] border border-[#A4A88A]/30 hover:border-[#354B3A] transition-all">
            Day 3 (Dec 26)
          </button>
          <button data-day="4" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-[#282824] border border-[#A4A88A]/30 hover:border-[#354B3A] transition-all">
            Day 4 (Dec 27)
          </button>
          <button data-day="5" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-[#282824] border border-[#A4A88A]/30 hover:border-[#354B3A] transition-all">
            Day 5 (Dec 28)
          </button>
        </div>

        <!-- Search Input -->
        <div class="relative w-full sm:w-64">
          <input id="schedule-search" type="text" placeholder="Search activities..." 
                 class="w-full px-3.5 py-2 pl-9 rounded-xl border border-[#A4A88A]/40 text-xs focus:outline-none focus:border-[#354B3A] bg-white" />
          <svg class="w-4 h-4 text-[#A4A88A] absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Master Vertical Timeline Container -->
    <div id="timeline-container" class="relative">
      <!-- Populated dynamically by schedule.js -->
    </div>
  </main>

  <!-- Add / Edit Activity Modal -->
  <div id="activity-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop animate-fade-in">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-[#A4A88A]/30 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
        <h3 id="modal-title" class="font-serif text-xl font-bold text-[#282824]">Add Trip Activity</h3>
        <button id="cancel-modal-btn" class="text-gray-400 hover:text-[#282824]">✕</button>
      </div>

      <form id="activity-form" class="space-y-4 text-xs">
        <input type="hidden" id="act-id" />

        <div>
          <label class="block font-semibold uppercase tracking-wider text-[#A4A88A] mb-1">Activity Title *</label>
          <input id="act-title" required placeholder="e.g. RoboWars Arena at Gymkhana" 
                 class="w-full px-3 py-2 rounded-lg border border-[#A4A88A]/40 text-xs focus:outline-none focus:border-[#354B3A]" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold uppercase tracking-wider text-[#A4A88A] mb-1">Trip Day *</label>
            <select id="act-day" class="w-full px-3 py-2 rounded-lg border border-[#A4A88A]/40 text-xs focus:outline-none focus:border-[#354B3A]">
              <option value="1">Day 1 (Dec 24)</option>
              <option value="2">Day 2 (Dec 25)</option>
              <option value="3">Day 3 (Dec 26)</option>
              <option value="4">Day 4 (Dec 27)</option>
              <option value="5">Day 5 (Dec 28)</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold uppercase tracking-wider text-[#A4A88A] mb-1">Scheduled Time *</label>
            <input id="act-time" required placeholder="e.g. 02:30 PM" 
                   class="w-full px-3 py-2 rounded-lg border border-[#A4A88A]/40 text-xs focus:outline-none focus:border-[#354B3A]" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold uppercase tracking-wider text-[#A4A88A] mb-1">Category *</label>
            <select id="act-category" class="w-full px-3 py-2 rounded-lg border border-[#A4A88A]/40 text-xs focus:outline-none focus:border-[#354B3A]">
              <option value="Techfest">Techfest</option>
              <option value="Sightseeing">Sightseeing</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Logistics">Logistics</option>
              <option value="Memories">Memories</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold uppercase tracking-wider text-[#A4A88A] mb-1">Location / Landmark *</label>
            <input id="act-location" required placeholder="e.g. Convocation Hall, IIT Bombay" 
                   class="w-full px-3 py-2 rounded-lg border border-[#A4A88A]/40 text-xs focus:outline-none focus:border-[#354B3A]" />
          </div>
        </div>

        <div>
          <label class="block font-semibold uppercase tracking-wider text-[#A4A88A] mb-1">Google Maps Link (Optional)</label>
          <input id="act-mapurl" placeholder="https://maps.google.com/?q=..." 
                 class="w-full px-3 py-2 rounded-lg border border-[#A4A88A]/40 text-xs focus:outline-none focus:border-[#354B3A]" />
        </div>

        <div>
          <label class="block font-semibold uppercase tracking-wider text-[#A4A88A] mb-1">Description & Notes</label>
          <textarea id="act-desc" rows="3" placeholder="Tips for the squad, meet-up spots, what to bring..." 
                    class="w-full px-3 py-2 rounded-lg border border-[#A4A88A]/40 text-xs focus:outline-none focus:border-[#354B3A]"></textarea>
        </div>

        <div class="flex gap-2 pt-3">
          <button type="button" onclick="document.getElementById('activity-modal').classList.add('hidden')" 
                  class="flex-1 py-2.5 rounded-lg border border-[#A4A88A]/40 font-semibold text-[#282824] hover:bg-gray-50">
            Cancel
          </button>
          <button type="submit" 
                  class="flex-1 py-2.5 rounded-lg bg-[#354B3A] hover:bg-[#243428] text-white font-semibold transition-colors">
            Save to Itinerary
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Shared Footer -->
  <footer class="mt-20 border-t border-[#A4A88A]/30 bg-white/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col sm:flex-row items-center justify-between text-xs text-[#282824]/70">
      <span>The 12 Chronicles • Mumbai 2026</span>
      <button onclick="window.openFirebaseSettingsModal()" class="text-[#354B3A] font-semibold hover:underline mt-2 sm:mt-0">
        🔥 Firebase Status: Sync Ready
      </button>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
